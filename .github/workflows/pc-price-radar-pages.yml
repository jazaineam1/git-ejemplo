name: PC Price Radar - publicar Pages
on:
  push:
    branches: [main]
    paths:
      - "pc-price-radar/**"
      - ".github/workflows/pc-price-radar-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pc-price-radar-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar Pages sin generar fallo si está deshabilitado
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages no habilitado/accesible (HTTP $status). Actívalo en Settings > Pages > Source: GitHub Actions. Despliegue omitido sin fallo."
          fi
      - name: Descargar código
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Validar todos los JSON
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in catalog.json offers.json sources-status.json price-history.json deals.json; do
            python -m json.tool "pc-price-radar/$f" > /dev/null
          done
      - name: Configurar Pages
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Preparar carpeta estática
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/pc-price-radar
          cp -r pc-price-radar/. _site/pc-price-radar/
          touch _site/.nojekyll
          printf '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PC Price Radar</title><meta http-equiv="refresh" content="0; url=./pc-price-radar/"><a href="./pc-price-radar/">Entrar</a></html>' > _site/index.html
      - name: Subir artefacto
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar Pages
        if: steps.preflight.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
